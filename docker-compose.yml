services:
  # ── Module 1: Frontend ───────────────────────────────────────────────────────
  web:
    build: ./frontend
    ports:
      - "80:80"
    depends_on:
      - api
    networks:
      - codeforge_network

  # ── Module 2: Backend API ────────────────────────────────────────────────────
  api:
    build: ./backend
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=${DATABASE_URL:-postgresql+asyncpg://codeforge:password@db:5432/codeforge}
      - REDIS_URL=${REDIS_URL:-redis://redis:6379/0}
      - DOCKER_HOST=${DOCKER_HOST:-unix:///var/run/docker.sock}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - submissions:/app/submissions
      - ./problems:/app/problems:ro
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - codeforge_network

  # ── Module 3: Celery Worker ──────────────────────────────────────────────────
  worker:
    build: ./backend
    command: celery -A app.worker.celery_app worker --loglevel=info --concurrency=4
    environment:
      - DATABASE_URL=${DATABASE_URL:-postgresql+asyncpg://codeforge:password@db:5432/codeforge}
      - REDIS_URL=${REDIS_URL:-redis://redis:6379/0}
      - DOCKER_HOST=${DOCKER_HOST:-unix:///var/run/docker.sock}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - submissions:/app/submissions
      - ./problems:/app/problems:ro
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - codeforge_network

  # ── Module 4: Message Broker ─────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    volumes:
      - redis_data:/data
    networks:
      - codeforge_network

  # ── Module 5: Database ───────────────────────────────────────────────────────
  db:
    image: postgres:16-alpine
    environment:
      - POSTGRES_DB=codeforge
      - POSTGRES_USER=codeforge
      - POSTGRES_PASSWORD=password
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U codeforge -d codeforge"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - codeforge_network

  # ── Monitoring Stack ─────────────────────────────────────────────────────────
  prometheus:
    image: prom/prometheus:latest
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"
    networks:
      - codeforge_network

  grafana:
    image: grafana/grafana:latest
    ports:
      - "3000:3000"
    volumes:
      - grafana_data:/var/lib/grafana
    networks:
      - codeforge_network

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:latest
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
    ports:
      - "8080:8080"
    networks:
      - codeforge_network

volumes:
  pg_data:
  redis_data:
  grafana_data:
  submissions:

networks:
  codeforge_network:
    driver: bridge
